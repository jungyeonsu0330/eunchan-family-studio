<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="childBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="childSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="yellowHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="120" cy="120" r="110" fill="url(#childBg)" filter="url(#cShadow)"/>
  <circle cx="120" cy="120" r="102" fill="#fffbeb" opacity="0.95"/>

  <!-- Body / Yellow Hoodie -->
  <path d="M 65,220 C 65,178 88,162 120,162 C 152,162 175,178 175,220 Z" fill="url(#yellowHoodie)"/>
  <path d="M 104,162 Q 120,182 136,162 Z" fill="#d97706"/>

  <!-- Neck -->
  <rect x="110" y="145" width="20" height="20" rx="5" fill="url(#childSkin)"/>

  <!-- Head -->
  <ellipse cx="120" cy="112" rx="40" ry="42" fill="url(#childSkin)"/>

  <!-- Ears -->
  <circle cx="78" cy="114" r="8" fill="#fed7aa"/>
  <circle cx="162" cy="114" r="8" fill="#fed7aa"/>

  <!-- Hair & Cute Cap -->
  <path d="M 76,102 C 76,68 92,54 120,54 C 148,54 164,68 164,102 C 164,102 152,88 138,88 C 124,88 120,95 106,90 C 94,86 82,98 76,102 Z" fill="#334155"/>
  <!-- Cap visor -->
  <path d="M 85,76 Q 120,62 155,76 Q 165,70 148,60 Q 120,52 92,60 Z" fill="#3b82f6"/>
  <path d="M 92,64 C 92,45 104,38 120,38 C 136,38 148,45 148,64 Z" fill="#2563eb"/>
  <circle cx="120" cy="38" r="4" fill="#fbbf24"/>

  <!-- Eyes (Big Sparkling Anime-like Kid Eyes) -->
  <ellipse cx="102" cy="112" rx="7.5" ry="9" fill="#1e293b"/>
  <circle cx="100" cy="108" r="3.2" fill="#ffffff"/>
  <circle cx="104" cy="114" r="1.5" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="138" cy="112" rx="7.5" ry="9" fill="#1e293b"/>
  <circle cx="136" cy="108" r="3.2" fill="#ffffff"/>
  <circle cx="140" cy="114" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 94,98 Q 102,94 110,98" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 130,98 Q 138,94 146,98" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cute Nose -->
  <circle cx="120" cy="120" r="2" fill="#ea580c"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="90" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="150" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.6"/>

  <!-- Big Cheerful Open Smile -->
  <path d="M 108,126 Q 120,146 132,126 Z" fill="#e11d48"/>
  <path d="M 112,127 Q 120,132 128,127 Z" fill="#ffffff"/>

  <!-- Sparkle Badge "씩씩한 은찬이" -->
  <rect x="52" y="196" width="136" height="26" rx="13" fill="#ea580c" stroke="#fef08a" stroke-width="2"/>
  <text x="120" y="214" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⭐ 은찬이 (7·8·9세)</text>
</svg>